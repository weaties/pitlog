services:
  postgres:
    image: postgres:17-alpine
    # Deliberately no container_name: Compose derives one from the directory, so
    # two checkouts — or two agent worktrees, which AGENTS.md encourages — do
    # not collide on a fixed name. Reach it with `docker compose exec postgres`.
    restart: unless-stopped
    environment:
      POSTGRES_USER: pitlog
      POSTGRES_PASSWORD: pitlog
      POSTGRES_DB: pitlog
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pitlog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pitlog -d pitlog']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pitlog-pgdata:
