services:
  postgres:
    image: postgres:17-alpine
    container_name: pitlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pitlog
      POSTGRES_PASSWORD: pitlog
      POSTGRES_DB: pitlog
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pitlog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pitlog -d pitlog']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pitlog-pgdata:
