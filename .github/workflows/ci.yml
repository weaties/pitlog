name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test

  smoke:
    name: browser smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pitlog
          POSTGRES_PASSWORD: pitlog
          POSTGRES_DB: pitlog
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U pitlog -d pitlog"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://pitlog:pitlog@localhost:5433/pitlog
      AUTH_SECRET: ci-only-insecure-secret-0000000000000000
      APP_ORIGIN: http://localhost:5173
      VITE_API_URL: http://localhost:8787
      API_PORT: '8787'
      MAIL_TRANSPORT: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Migrate + seed
        run: npm run db:migrate && npm run db:seed
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fail on high/critical only. As of M0 there are 4 moderate advisories,
      # all from drizzle-kit's dev-only transitive esbuild; drizzle-kit is a CLI
      # we run by hand, never a served dev server. Revisit when drizzle-kit
      # drops @esbuild-kit.
      - run: npm audit --audit-level=high
